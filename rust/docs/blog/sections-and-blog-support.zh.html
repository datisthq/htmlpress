<!doctype html>
<html lang="zh">
  <head>
    <title>分区与博客支持</title>
    <meta name="description" content="介绍 Htmlpress 中可配置的分区和博客支持" />
    <meta name="author" content="Htmlpress Team" />
    <meta name="date" content="2026-04-15" />
    <meta name="keywords" content="features, announcement" />
  </head>
  <body>
    <h1>分区与博客支持</h1>
    <p>我们刚刚发布了两项重要功能：可配置的分区和博客支持。</p>

    <h2>分区</h2>
    <p>
      现在你可以把站点拆分为多个分区。每个分区在页眉中显示为一个标签页，侧边栏只显示当前分区的页面。
    </p>
    <pre><code class="language-yaml">sections:
  - title: Docs
    prefix: /
  - title: Blog
    prefix: /blog/
    type: blog</code></pre>

    <h2>博客</h2>
    <p>
      博客分区按从新到旧的顺序列出文章，构建时还会添加一个按日期列出所有文章的索引页、每个标签一个页面以及一个
      RSS 订阅源。本博客就是这样一个分区：参见<a
        href="/zh/customization/article-sections/"
        >文章分区</a
      >。
    </p>
  </body>
</html>
