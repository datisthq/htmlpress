[package]
name = "htmlpress"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "Turn a folder of HTML pages into a site: one layout, one theme, live reload, made for agents"
license = "MIT"
authors = ["Evgeny Karev"]
repository = "https://github.com/datisthq/htmlpress"
homepage = "https://htmlpress.dev"
readme = "README.md"
keywords = ["html", "static-site", "generator", "llm", "agents"]
categories = ["command-line-utilities", "web-programming"]
include = ["src/**/*", "README.md", "LICENSE.md"]

[[bin]]
name = "htmlpress"
path = "src/main.rs"

[dependencies]
emojis = "0.9.1"
fireargs = "0.3.1"
giallo = { version = "0.5.2", features = ["dump"] }
glob = "0.3.4"
htmd = "0.5.6"
linkify = "0.11.0"
lol_html = "3.0.2"
math-core = "0.9.0"
notify = "8.2.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
pollster = "1.0.1"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
