[package]
name = "htmlpress"
version = "0.12.4"
edition = "2024"
rust-version = "1.89"
description = "HTML-first static site generator: HTML pages, or Markdown, from anywhere in a project become one site with one layout, one theme and live reload, for humans and agents"
license = "MIT"
authors = ["Evgeny Karev"]
repository = "https://github.com/datisthq/htmlpress"
homepage = "https://htmlpress.dev"
readme = "README.md"
keywords = ["html", "static-site", "generator", "llm", "agents"]
categories = ["command-line-utilities", "web-programming"]
include = ["src/**/*", "README.md", "LICENSE.md"]

[[bin]]
name = "htmlpress"
path = "src/main.rs"

[dependencies]
fireargs = "0.3.1"
glob = "0.3.4"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
textlane = { version = "0.8.1", default-features = false, features = [
  "md",
  "html",
  "highlight",
  "katex",
] }
tiny_http = "0.12.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
pollster = "1.0.1"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# A copy of a dependency with a fix htmlpress needs, until upstream ships it, as textlane
# vendors it: the release binaries build with it; a crates.io build takes the published
# crate, whose global lock serializes the regex compiles of a parallel build
[patch.crates-io]
onig-regset = { path = "vendor/onig-regset" }
