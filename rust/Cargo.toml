[package]
name = "htmlpress"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Turn a folder of HTML pages into a site: one layout, one theme, live reload, made for agents"
license = "MIT"
authors = ["Evgeny Karev"]
repository = "https://github.com/datisthq/htmlpress"
homepage = "https://htmlpress.dev"
readme = "README.md"
keywords = ["html", "static-site", "generator", "llm", "agents"]
categories = ["command-line-utilities", "web-programming"]
include = ["src/**/*", "README.md", "LICENSE.md"]

[[bin]]
name = "htmlpress"
path = "src/main.rs"

[dependencies]
fireargs = "0.3.0"
lol_html = "3.0.2"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
tiny_http = "0.12.0"

[dev-dependencies]
pollster = "1.0.1"
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
