  es: '<aside aria-label="Announcement"><p><span>Htmlpress está en vista previa técnica</span><a href="https://github.com/datisthq/htmlpress/issues"><span>Envía tus comentarios</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg></a></p></aside>'
  zh: '<aside aria-label="Announcement"><p><span>Htmlpress 正处于技术预览阶段</span><a href="https://github.com/datisthq/htmlpress/issues"><span>反馈意见</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg></a></p></aside>'
languages:
  - code: en
    label: English
  - code: es
    label: Español
  - code: zh
    label: 简体中文
links:
  - title: GitHub
    url: https://github.com/datisthq/htmlpress
    icon: github
sections:
  - title: { en: Docs, es: Documentación, zh: 文档 }
    type: custom
    url: /introduction.html
    icon: book-open
  - title: { en: Blog, es: Blog, zh: 博客 }
    type: blog
    prefix: /blog/
    icon: rss
  - title: { en: Changelog, es: Registro de cambios, zh: 更新日志 }
    type: changelog
    prefix: /changelog/
    source: CHANGELOG.md
    version: true
    icon: history
include: rust/docs/**/*.html
exclude: rust/docs/includes/**
skills: .skills/*/SKILL.md
edit: https://github.com/datisthq/htmlpress/edit/main/
