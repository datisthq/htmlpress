site: https://htmlpress.dev
title: Htmlpress
logo: /logo.svg
favicon: /logo.png
description:
  en: Static site generator
  es: Generador de sitios estáticos
  zh: 静态站点生成器
banner:
  en: '<aside aria-label="Announcement"><p><span><span>Htmlpress is in technical preview</span><span>Technical preview</span></span><span aria-hidden="true">·</span><a href="https://github.com/datisthq/htmlpress/discussions"><span>Share feedback</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg></a></p></aside>'
  es: '<aside aria-label="Announcement"><p><span><span>Htmlpress está en vista previa técnica</span><span>Vista previa técnica</span></span><span aria-hidden="true">·</span><a href="https://github.com/datisthq/htmlpress/discussions"><span>Danos tu opinión</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg></a></p></aside>'
  zh: '<aside aria-label="Announcement"><p><span><span>Htmlpress 正处于技术预览阶段</span><span>技术预览</span></span><span aria-hidden="true">·</span><a href="https://github.com/datisthq/htmlpress/discussions"><span>反馈意见</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg></a></p></aside>'
languages:
  - code: en
    label: English
  - code: es
    label: Español
  - code: zh
    label: 简体中文
links:
  - title: GitHub
    url: https://github.com/datisthq/htmlpress
    icon: github
sections:
  - title: { en: Docs, es: Documentación, zh: 文档 }
    type: custom
    url: /introduction/
    icon: book-open
  - title: { en: Examples, es: Ejemplos, zh: 示例 }
    prefix: /examples/
    icon: chart-column
  - title: { en: Blog, es: Blog, zh: 博客 }
    type: blog
    prefix: /blog/
    icon: rss
  - title: { en: Changelog, es: Registro de cambios, zh: 更新日志 }
    type: changelog
    prefix: /changelog/
    source: CHANGELOG.md
    version: true
    icon: history
include:
  - rust/docs/**/*.html
  - rust/blog/**/*.html
exclude: rust/docs/includes/**
skills: rust/skills/*/SKILL.md
edit: https://github.com/datisthq/htmlpress/edit/main/
head:
  scripts:
    - defer: ""
      data-site-id: "3"
      src: https://analytics.datist.io/api/script.js
